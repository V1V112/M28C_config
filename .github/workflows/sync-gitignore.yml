name: Check tracked ignored files

on:
  push:
    paths:
      - ".gitignore"
      - "**/.gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-gitignore:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the triggering branch
        uses: actions/checkout@v4

      - name: Ensure ignored files were untracked locally
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files -ci --exclude-standard | grep -q .; then
            echo "::error::Some ignored files are still tracked."
            git ls-files -ci --exclude-standard
            echo "Run the local pre-commit hook (or git rm --cached) before pushing."
            exit 1
          fi

          echo "No ignored files are tracked."
