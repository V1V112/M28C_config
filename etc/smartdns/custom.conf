# ============================================================
# SmartDNS 配置
# 端口规划：
#   531 -> direct   国内 / 直连 DNS 组
#   532 -> overseas 海外 / ECS DNS 组
# ============================================================


# ============================================================
# 监听端口
# ============================================================

# direct 组：跳过 nameserver 规则，关闭双栈优选，禁用 HTTPS 记录查询
bind [::]:531 -group direct -no-dualstack-selection -force-https-soa -no-rule-nameserver

# overseas 组：跳过 nameserver 规则，关闭双栈优选，禁用 HTTPS 记录查询
bind [::]:532 -group overseas -no-dualstack-selection -force-https-soa -no-rule-nameserver


# ============================================================
# 日志
# ============================================================

log-level off
log-file /etc/smartdns/smartdns.log
log-size 16M
log-num 1

# 审计日志轮转参数
# 注意：如果未启用 audit-enable yes，则这里只是保留参数，不会主动开启审计日志
audit-size 64K
audit-num 1


# ============================================================
# 缓存
# ============================================================

cache-size 32768

# 域名预加载
prefetch-domain yes

# 持久化缓存
cache-persist yes
cache-file /etc/smartdns/smartdns.cache
cache-checkpoint-time 1800


# ============================================================
# 过期缓存
# ============================================================

serve-expired yes
serve-expired-reply-ttl 2
serve-expired-ttl 1200
serve-expired-prefetch-time 600


# ============================================================
# 查询 / 测速策略
# ============================================================

# 测速模式
speed-check-mode ping,tcp:443,tcp:80

# 返回策略：
# first-ping        = DNS 响应延迟 + IP 测速综合最快
# fastest-ip        = 等待测速后返回最快 IP
# fastest-response  = 返回最快响应的 DNS 结果
response-mode first-ping

# 允许返回给客户端的最大 IP 数量
max-reply-ip-num 1

# 强制指定 qtype 返回 SOA
# 65 = HTTPS RR，用于禁用 HTTPS 记录查询
force-qtype-SOA 65

# TCP 连接空闲超时时间
tcp-idle-time 120


# ============================================================
# TTL 设置
# ============================================================

# 如需强制压低 TTL，可取消下面几项注释
# rr-ttl 2
# rr-ttl-min 2
# rr-ttl-max 2
# rr-ttl-reply-max 2


# ============================================================
# IPv6 / 双栈设置
# ============================================================

# 关闭全局双栈 IP 优选
dualstack-ip-selection no

# 支持读取 dnsmasq DHCP 租约解析本地主机名
# dnsmasq-lease-file /tmp/dnsmasq.leases

# 启用 mDNS 查询本地网络主机名
# mdns-lookup yes


# ============================================================
# 上游 DNS：direct 组
# ============================================================

# ISP DNS
server 120.80.80.80 -group direct -exclude-default-group
server 221.5.88.88 -group direct -exclude-default-group

# 可选：AliDNS
# server 223.5.5.5 -group direct -exclude-default-group
# server 223.6.6.6 -group direct -exclude-default-group

# 可选：腾讯 DNS
# server 119.29.29.29 -group direct -exclude-default-group


# ============================================================
# 上游 DNS：overseas 组
# ============================================================

# 自建 DoH，开启 ECS
server-https https://dns2ecs.sharedrive.cc/V1V1V112 \
  -host-ip 23.224.49.102 \
  -group overseas \
  -exclude-default-group \
  -subnet 120.80.80.80/24 \
  -subnet-all-query-types

# 备用自建 DoH
# server-https https://dns.sharedrive.cc/V1V1V112 \
#   -host-ip 23.224.49.102 \
#   -group overseas \
#   -exclude-default-group \
#   -subnet 120.80.80.80/32 \
#   -subnet-all-query-types

# 果冻 DNS DoT，开启 ECS
server-tls t627536994.6.00p.net:853 \
  -group overseas \
  -exclude-default-group \
  -subnet 120.80.80.80/24 \
  -subnet-all-query-types

# Cloudflare DoT，作为 fallback
server-tls 1.1.1.1:853 \
  -group overseas \
  -exclude-default-group \
  -fallback

# 可选：Google DoT，作为 fallback
# server-tls 8.8.8.8:853 \
#   -group overseas \
#   -exclude-default-group \
#   -fallback

# 可选：国外公益 DoH ECS
# server-https https://v.recipes/dns-ecs \
#   -group overseas \
#   -exclude-default-group \
#   -subnet 120.82.69.34/24 \
#   -k


# ============================================================
# WebUI 插件
# ============================================================

plugin smartdns_ui.so

smartdns-ui.ip http://0.0.0.0:6080
smartdns-ui.token-expire 600
smartdns-ui.max-query-log-age 3600

# 数据文件存储路径
# data-dir /etc/smartdns/db