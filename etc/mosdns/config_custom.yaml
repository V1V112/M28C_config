log:
  level: error    # 日志级别。可选 "debug" "info" "warn" "error"。默认 "info"。
  # 日志文件路径。默认 "mosdns.log"（当前目录）。如果不需要日志文件可设置为 ""。
  file: mosdns.log


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 在主配置加载前先加载下面的配置文件。可以使用相对路径或绝对路径。
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
include:
  ## NFT 规则添加 ##
  - mosdns_nft/nft.yaml
  ## AdGuard 去广告 ##
  - mosdns_adguard/adguard.yaml
  ## 域名 / IP 列表 ##
  - mosdns_rules/rules.yaml
  ## 缓存插件 ##
  - mosdns_cache/cache.yaml
  ## 上游服务器 ##
  - mosdns_forward/forward.yaml
  ## 未知域名 / 故障转移 ##
  - mosdns_fallback/fallback.yaml
  ## 优选域名替换插件 ##
  - mosdns_prefer_domain/prefer_domain.yaml

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 主配置文件
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
plugins:
  ## 自定义域名列表 ##
  # 列表中的域名使用 FakeDNS 解析
  - tag: custom_fakeip
    type: domain_set
    args:
      exps:
        # 以 domain: 开头，域匹配。例: domain:google.com 会匹配自身 google.com，以及其子域名 www.google.com, maps.l.google.com 等。
        # 以 full: 开头，完整匹配。例: full:google.com 只会匹配自身。
        # 以 keyword: 开头，关键字匹配。例: keyword:google.com 会匹配包含这个字段的域名，如 google.com.hk, www.google.com.hk。
        # 以 regexp: 开头，正则匹配(Golang 标准)。例: regexp:.+\.google\.com$。
        - domain:emby.as174.de      # Emby
        - domain:javmenu.com      # Javdb
        - domain:jdbstatic.com      # Javdb
        - keyword:browserleaks      # DNS Leak Test

  # 列表中的域名使用 Direct 解析
  - tag: custom_direct
    type: domain_set
    args:
      exps:
        - domain:origin-a.akamaihd.net      # EA

  # 重定向域名列表
  - tag: redirect
    type: redirect
    args:
      rules:
        # - a.com b.com      # a.com 域名使用 b.com 解析结果


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 子运行序列（Sub Sequences）是主运行序列中的一个步骤，可以包含自己的执行步骤和条件判断。
# 通过 try 调用子运行序列可以捕获其中的 ErrExit 错误，避免影响主运行序列的执行流程。
# prefer_ipv4 / IPv4 优先会并发触发参考 A 查询
# 此子序列内部可用 exit，但由 main_sequence 通过 try 调用以避免 ErrExit 影响 prefer_ipv4 判断
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - tag: resolve_after_prefer
    type: sequence
    args:

      # ====== 域名重定向 ====== #
      - exec: $redirect      # 域名重定向列表
      - matches: has_resp      # 有应答
        exec: exit      # 结束分支

      # ====== 自定义域名使用 Direct 解析 ====== #
      - matches: qname
          $custom_direct     # 自定义域名列表
        exec: $cache_direct      # 使用 Direct 独立缓存；未命中时再交给 Direct
      - matches: has_resp      # 有应答
        exec: exit      # 结束分支

      # ====== GEOSITE 规则和自定义域名使用 FakeDNS 解析 ====== #
      - matches: qname
          $custom_fakeip
          $geosite:category-ai-!cn
          $geosite:github
          $geosite:onedrive
          $geosite:pikpak
          $geosite:pinterest
          # $geosite:cloudflare
        exec: $fakeip_or_overseas      # 使用 FakeDNS 故障转移解析：如果 FakeDNS 没有任何应答、超时、异常，才走 Overseas
      - matches: has_resp      # 有应答
        exec: exit      # 结束分支

      # ====== 使用 Direct 解析 ====== #
      - matches: qname
          $geosite:direct      # 直连域名列表
        exec: $cache_direct      # 使用 Direct 独立缓存；未命中时再交给 Direct
      - matches: has_resp      # 有应答
        exec: exit      # 结束分支

      # ====== 使用 FakeDNS 解析 ====== #
      - matches: qname
          $geosite:gfw      # GFW 规则列表
        exec: $fakeip_or_overseas      # 使用 FakeDNS 故障转移解析：如果 FakeDNS 没有任何应答、超时、异常，才走 Overseas
      - matches: has_resp      # 有应答
        exec: exit      # 结束分支

      # ====== 使用 Overseas 解析 ====== #
      - matches: qname
          $geosite:overseas      # 国外域名列表
        exec: $cache_overseas      # 使用 Overseas 独立缓存；未命中时再交给 Overseas
      - matches: has_resp      # 有应答
        exec: exit      # 结束分支

      # ====== 解析未知域名 ====== #      可选：$fallback / $Direct / $cache_direct / $Overseas / $cache_overseas 根据实际情况调整顺序和分组
      - exec: $fallback      # 使用 fallback 解析
      - matches: has_resp      # 有应答
        exec: exit      # 结束分支


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 主运行序列是 DNS 查询的入口，定义了查询的整体处理流程。可以包含多个步骤，每个步骤可以是插件执行或条件判断。
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - tag: main_sequence
    type: sequence
    args:
      # Direct / Overseas 缓存已下沉到各自解析序列。
      # 主序列不再预查公共缓存，避免两个解析组互相命中对方结果。

      # ====== 本地 hosts 列表 ====== # 
      - exec: $hosts      # 本地 hosts 列表
      - matches: has_resp      # 有应答
        exec: exit      # 结束分支

      # ====== 屏蔽 SOA / PTR / HTTPS / SVCB 类型 ====== # 
      - matches:
        - qtype 6 12 65 64      # SOA / PTR / HTTPS / SVCB 类型
        exec: 
          - reject 0      # NOERROR / 返回空响应
          - exit      # 结束分支

      # ====== 屏蔽 AdGuard 在线广告域名 ====== # 
      - matches: qname $AdGuard      # AdGuard 在线规则插件
        exec:
          - reject 0      # NOERROR / 返回空响应
          - exit      # 结束分支

      # ====== 优先返回IPv4地址 ====== # 
      - exec: prefer_ipv4      # 并发触发 A / AAAA 查询，优先返回 A 记录
      - exec: try $resolve_after_prefer      # 进入 prefer_ipv4 子序列，处理 A 查询结果；如果子序列中 exit 导致 ErrExit 错误，则捕获并继续执行 AAAA 查询

      # ====== 最终响应 IP 优选替换 ====== #
      # normal resolver / fallback 已经得到最终 A/AAAA 响应后，再统一检查并替换命中的地址。
      # 无响应、非 A/AAAA、非 NOERROR、IP 未命中或优选查询失败时均保持原结果。
      - exec: $prefer_domain_cf


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 启动监听服务
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - tag: udp_server
    type: udp_server      # UDP 监听服务
    args:
      entry: main_sequence      # 入口运行序列
      listen: :53      # 监听地址和端口，格式为 IP:PORT
      enable_audit: true      # 是否启用审计日志
      fast_cache:
        # 可选模式：
        # off：完全关闭 Fast Cache。
        # kernel：只使用 eBPF 内核缓存。不创建用户态缓存表，内存占用更低。
        # userspace：只使用 Go 用户态缓存。不依赖 eBPF，但查询必须先进入 mosdns 才能命中。
        # both：同时使用内核缓存和用户态缓存。加速覆盖更完整，但会增加内存占用。
        mode: kernel

        # 用户态缓存最大条目数。
        # 仅 mode 为 userspace 或 both 时才能填写。
        # mode: kernel 或 off 时必须删除/注释此项。
        # 必须是 2 的整数次幂。
        # 有效范围：4 ～ 4194304。
        # 未填写时默认：262144。
        # 262144 对应约 2 MiB 的基础指针表，
        # 实际内存还包括缓存的 DNS 响应内容。
        # size: 262144

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# API 监听服务
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
api:
  http: 0.0.0.0:9099
