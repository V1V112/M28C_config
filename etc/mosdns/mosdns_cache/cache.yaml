plugins:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Direct 独立缓存
  # 仅供 cached_smartdns_direct 使用，不与 Overseas 共享条目。
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - tag: dns_cache_direct
    type: cache
    args:
      # 内存中最多保存的缓存条目数
      # M28C 1 GB 内存使用 20000 比较合适
      # 两套缓存合计仍为 20000，避免分离后内存占用直接翻倍
      size: 10000

      # 命中这些 IP 的应答不进行缓存
      exclude_ip:
        - 198.18.0.0/15
        - 28.0.0.0/8
        - 30.0.0.0/8
        - 2001:2::/64
        - fc00::/18

      # 命中后完全不写入缓存
      exclude_domain:
        exps:
          # - domain:example.com

        domain_sets:
          # - geosite:example

      # 过期缓存保留时间，单位：秒
      # 缓存过期后仍保留指定时间，可在主动刷新失败时作为兜底
      # 设置为 86400 表示过期缓存继续保留 24 小时
      # 设置为 0 表示完全禁用过期缓存
      lazy_cache_ttl: 86400

      # Direct 独立缓存持久化文件
      # mosdns 重启后可以恢复尚未彻底失效的 Direct 缓存
      dump_file: direct_cache.dump

      # 缓存写入磁盘的检查周期，单位：秒
      dump_interval: 600

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 主动刷新缓存
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      active_refresh:

        # 是否启用主动刷新功能
        enabled: true

        # 普通cache可以保存100000条，
        # 但主动刷新最多只追踪10000条
        max_tracked_entries: 10000

        # 3600秒内至少有2次真实访问才开始主动刷新
        admission_hits: 2
        admission_window: 3600

        # 热度每3600秒减半
        heat_half_life: 3600

        # 热门区占80%，新进入观察区占20%
        protected_ratio: 80

        # CLOCK一次最多检查64条，避免长时间持锁
        eviction_scan_limit: 64

        # 最多提前x秒刷新，单位：秒
        # 实际刷新窗口还会受到 TTL/3 限制：
        # TTL 60 秒时，即使这里填 30 或 60，实际都是提前约 20 秒刷新。
        # TTL 120 秒时、这里填 30，则大约在第 90 秒刷新。
        # threshold 越小 → 刷新越晚 → 周期越长 → 上游请求更少
        # threshold 越大 → 刷新越早 → 周期越短 → 上游请求更多
        #
        # 30：负载更低，适合你现在任务堆积的情况。
        # 60：刷新更早，但任务产生速度更高。
        threshold: 5

        # 真实客户端超过多久没有访问，就停止主动刷新。
        # 就停止主动刷新该缓存，单位：秒
        # 设置为 0 表示不限制
        max_idle_time: 86400

        # 续主动刷新x次，仍然没有真实客户端访问，就停止刷新。
        # 真实客户端再次访问后自动清零并恢复主动刷新。
        # 设置为 0 表示不限制
        #
        # 填20时：
        # TTL 60 秒：约 20×40秒 = 13分钟后停止
        # TTL 120秒：约 20×90秒 = 30分钟后停止
        # TTL 300秒：会先被 max_idle_time 的1小时限制停止
        max_refresh_times: 0

        # 单次主动查询超时。
        #
        # 源码内部最大只使用1000ms，填写超过1000没有意义。
        # 太小会增加失败、重试和探测任务；
        # 太大会长时间占用worker。
        requery_timeout_ms: 1000

        # 主动刷新长期平均最大查询速率
        # max_refresh_qps ≈ 客户端高峰 DNS QPS 的 10%～20%
        # 所有 Direct 主动刷新的总QPS，不是每个物理上游各128。
        #
        # concurrent: 2 / 有两个上游时：
        # 256总QPS大约分成每个上游 128QPS。
        max_refresh_qps: 128

        # 等待令牌或worker的最大任务数。
        #
        # 推荐：max_refresh_qps × 8～16
        # 这里采用256×16=4096。
        #
        # 太大：隐藏长期过载，任务可能排到过期。
        # 太小：高峰期间更早丢弃任务。
        # 降低它不会减少任务产生量，只是更早丢弃。
        max_pending_tasks: 2048

        # 同时执行主动刷新的 worker 数量
        # workers ≈ max_refresh_qps × 上游查询耗时（秒）× 1.5～2


        # 同时执行任务的最大数量。
        #
        # 计算公式：
        # workers ≈ QPS × 平均刷新耗时(秒) × 1.25～1.5
        #
        # 如果平均刷新耗时接近1秒：
        # 256×0.5×1.25≈160
        #
        # fallback_probe也会共用worker，所以比256多留一些余量。
        # 源码允许的最大值是256。
        workers: 128

        # 单次刷新周期中，
        # 重新查询失败后的最大重试次数
        max_retry_times: 2

        # 命中这些 IP 的应答不进行主动刷新
        exclude_ip:
          cidrs:
            # - 198.18.0.0/15

        # 命中这些域名规则的查询不进行主动刷新
        exclude_domain:
          exps:
            # - domain:example.com

          # 引用已注册并且实现 DomainMatcherProvider 的插件
          domain_sets:
            # - geosite:example

          # 从文件加载排除域名
          files:
            # - mosdns_cache/no_active_refresh.txt

        # ===== 主动刷新失败后的备用探测 =====
        fallback_probe:
          enabled: true

          # 每种探测方式的超时时间，单位：毫秒
          timeout_ms: 1000

          # 旧缓存 IP 探测成功后，
          # 将旧缓存临时续期的时间，单位：秒
          stale_extend_ttl: 60

          # 旧答案从原 TTL 到期开始，最多保留并允许探测的总时间，单位：秒
          # 超过 300 秒后停止拿这条旧答案探测和续期，等待正常查询生成新答案
          max_stale: 300

          # 按顺序尝试探测
          probes:
            - tcp:443
            - ping
            - tcp:80










  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Overseas 独立缓存
  # 仅供 cached_smartdns_overseas 使用，不与 Direct 共享条目。
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - tag: dns_cache_overseas
    type: cache
    args:
      # 内存中最多保存的缓存条目数
      # M28C 1 GB 内存使用 20000 比较合适
      # 两套缓存合计仍为 20000，避免分离后内存占用直接翻倍
      size: 10000

      # 命中这些 IP 的应答不进行缓存
      exclude_ip:
        - 198.18.0.0/15
        - 28.0.0.0/8
        - 30.0.0.0/8
        - 2001:2::/64
        - fc00::/18

      # 命中后完全不写入缓存
      # FakeIP 相关域名可继续保持不写入普通缓存
      exclude_domain:
        exps:
          # - domain:example.com

        domain_sets:
          # - geosite:example

      # 过期缓存保留时间，单位：秒
      # 缓存过期后仍保留指定时间，可在主动刷新失败时作为兜底
      # 设置为 86400 表示过期缓存继续保留 24 小时
      # 设置为 0 表示完全禁用过期缓存
      lazy_cache_ttl: 86400

      # Overseas 独立缓存持久化文件
      # mosdns 重启后可以恢复尚未彻底失效的 Overseas 缓存
      dump_file: overseas_cache.dump

      # 缓存写入磁盘的检查周期，单位：秒
      dump_interval: 600

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 主动刷新缓存
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      active_refresh:

        # 是否启用主动刷新功能
        enabled: false

        # 普通cache可以保存100000条，
        # 但主动刷新最多只追踪10000条
        max_tracked_entries: 10000

        # 3600秒内至少有2次真实访问才开始主动刷新
        admission_hits: 2
        admission_window: 3600

        # 热度每3600秒减半
        heat_half_life: 3600

        # 热门区占80%，新进入观察区占20%
        protected_ratio: 80

        # CLOCK一次最多检查64条，避免长时间持锁
        eviction_scan_limit: 64

        # 最多提前多少秒刷新，单位：秒
        # 实际刷新窗口还会受到 TTL/3 限制：
        # TTL 60 秒时，即使这里填 30 或 60，实际都是提前约 20 秒刷新。
        # TTL 120 秒时、这里填 30，则大约在第 90 秒刷新。
        # threshold 越小 → 刷新越晚 → 周期越长 → 上游请求更少
        # threshold 越大 → 刷新越早 → 周期越短 → 上游请求更多
        #
        # 30：负载更低，适合你现在任务堆积的情况。
        # 60：刷新更早，但任务产生速度更高。
        threshold: 5

        # 真实客户端超过多久没有访问，就停止主动刷新。
        # 就停止主动刷新该缓存，单位：秒
        # 设置为 0 表示不限制
        max_idle_time: 43200

        # 续主动刷新x次，仍然没有真实客户端访问，就停止刷新。
        # 真实客户端再次访问后自动清零并恢复主动刷新。
        # 设置为 0 表示不限制
        #
        # 填20时：
        # TTL 60 秒：约 20×40秒 = 13分钟后停止
        # TTL 120秒：约 20×90秒 = 30分钟后停止
        # TTL 300秒：会先被 max_idle_time 的1小时限制停止
        max_refresh_times: 0

        # 单次主动查询超时。
        #
        # 源码内部最大只使用1000ms，填写超过1000没有意义。
        # 太小会增加失败、重试和探测任务；
        # 太大会长时间占用worker。
        requery_timeout_ms: 1000

        # 主动刷新长期平均最大查询速率
        # max_refresh_qps ≈ 客户端高峰 DNS QPS 的 10%～20%
        # 所有 Overseas 主动刷新的总QPS，不是每个物理上游各128。
        #
        # concurrent: 1 / 有两个上游时：
        # 128总QPS大约分成每个上游 64QPS。
        max_refresh_qps: 128

        # 等待令牌或worker的最大任务数。
        #
        # 推荐：max_refresh_qps × 8～16
        # 这里采用128×16=2048。
        #
        # 太大：隐藏长期过载，任务可能排到过期。
        # 太小：高峰期间更早丢弃任务。
        # 降低它不会减少任务产生量，只是更早丢弃。
        max_pending_tasks: 2048

        # 同时执行任务的最大数量。
        #
        # 计算公式：
        # workers ≈ QPS × 平均刷新耗时(秒) × 1.25～1.5
        #
        # 如果平均刷新耗时接近1秒：
        # 128×0.5×1.25≈80
        #
        # fallback_probe 也会共用 worker，所以比 256 多留一些余量。
        # 源码允许的最大值是256。
        workers: 64

        # 单次刷新周期中，
        # 重新查询失败后的最大重试次数
        max_retry_times: 2

        # 命中这些 IP 的应答不进行主动刷新
        exclude_ip:
          cidrs:
            # - 198.18.0.0/15

        # 命中这些域名规则的查询不进行主动刷新
        exclude_domain:
          exps:
            # - domain:example.com

          # 引用已注册并且实现 DomainMatcherProvider 的插件
          domain_sets:
            # - geosite:example

          # 从文件加载排除域名
          files:
            # - mosdns_cache/no_active_refresh.txt

        # ===== 主动刷新失败后的备用探测 =====
        fallback_probe:
          enabled: true

          # 每种探测方式的超时时间，单位：毫秒
          timeout_ms: 1000

          # 旧缓存 IP 探测成功后，
          # 将旧缓存临时续期的时间，单位：秒
          stale_extend_ttl: 60

          # 旧答案从原 TTL 到期开始，最多保留并允许探测的总时间，单位：秒
          # 超过 300 秒后停止拿这条旧答案探测和续期，等待正常查询生成新答案
          max_stale: 300

          # 按顺序尝试探测
          probes:
            - tcp:443
            - ping
            - tcp:80