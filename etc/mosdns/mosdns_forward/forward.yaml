plugins:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 带缓存的 Direct 解析入口
  # 缓存未命中时，才进入对应上游。
  # 主动刷新也只会重新执行本组后续解析链，不会串到另一组。
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - tag: Direct
    type: forward
    args:
      concurrent: 2
      upstreams:
        - tag: 广东联通_DNS_1
          addr: udp://120.80.80.80
        - tag: 广东联通_DNS_2
          addr: udp://221.5.88.88

  - tag: cache_direct
    type: sequence
    args:
      - exec: $dns_cache_direct
      - matches:
          - "!has_resp"
        exec: $Direct

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 带缓存的 Overseas 解析入口
  # 缓存未命中时，才进入对应上游。
  # 主动刷新也只会重新执行本组后续解析链，不会串到另一组。
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - tag: Overseas
    type: forward
    args:
      concurrent: 2
      upstreams:
        - tag: 果冻DNS
          addr: tls://t627536994.6.00p.net
        - tag: 自建DNS_US
          addr: https://dns2ecs.sharedrive.cc/V1V1V112
          dial_addr: 23.224.49.102

  - tag: cache_overseas
    type: sequence
    args:
      - exec: $dns_cache_overseas
      - matches:
          - "!has_resp"
        exec: $Overseas

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # FakeIP DNS
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - tag: FakeDNS
    type: forward
    args:
      concurrent: 1
      upstreams:
        - tag: SingBox_FakeDNS
          addr: udp://127.0.0.1:5300