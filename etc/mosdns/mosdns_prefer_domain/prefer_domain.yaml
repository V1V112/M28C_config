# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Prefer Domain 最终响应地址替换插件
#
# 职责：
# 1. 仅后处理前一个 resolver / fallback 已生成的单问题 IN A/AAAA 响应。
# 2. 按 rules 顺序检查响应 Answer 中与查询类型一致的最终 A/AAAA 地址。
# 3. 地址命中 ip_matcher 后，只读取本插件实例独立维护的
#    prefer_domain + QTYPE 缓存；有可用缓存才替换命中 owner 的整个地址
#    RRset，客户端请求路径绝不现场查询优选域名。
# 4. 优选缓存尚未建立或不可用时，客户端仍正常走原解析流程，本插件
#    不做替换并完整保留原响应。
# 5. CNAME 链、未命中的其他 Answer、Ns、Extra、rcode 和响应头均保留；
#    被替换 RRset 的无效 RRSIG 会移除，AA/AD 会清除。
# 6. 优选域名的 A/AAAA 结果按 prefer_domain + QTYPE 分别保存在插件
#    私有缓存中，不使用 mosdns 的普通响应缓存。
#
# 后台行为：
# - 等 mosdns 的所有插件加载完成后才开始预热，确保 resolver tag 可用。
# - warm_on_start 首次预热遇到超时、网络/解析器错误、无响应或 SERVFAIL
#   时，每 15 秒重试一次，总共尝试 10 次；NXDOMAIN、NODATA 等非临时
#   DNS 结果不参加首轮重试。耗尽时刻作为后续 cache_ttl 窗口的起点。
# - 周期刷新每个窗口最多尝试 2 次；第一次因任意原因失败后立即再试一次。
#   第二次仍失败时不清空旧缓存，后续继续按 cache_ttl 派生窗口恢复。
# - cache_ttl 为必填项，单位秒且必须大于 5，是插件内部 TTL 和刷新窗口
#   的唯一依据；内部 TTL 不从 DNS 答案推导。
# - 成功后的刷新时刻固定为 stored + cache_ttl - 5秒。
# - 两次刷新均失败后，旧缓存先自然用到内部 TTL 到期。到期后仅当
#   serve_stale=true 才继续用过期地址替换并返回 TTL 0；false 时完整保留
#   客户端原响应。max_stale 仍限制最长兜底时间。
# - 客户端可见 TTL 沿用优选 DNS 答案并随缓存年龄递减；stale 固定为 0。
#
# 调用位置必须在正常解析之后，例如：
#
#   - exec:
#       - $fallback
#       - $prefer_domain_cf
#
# 当前主配置在 `try $resolve_after_prefer` 返回后统一调用本插件，因此
# custom direct、geosite direct、proxy 以及 fallback primary/secondary 的
# 最终响应都会进入同一后处理步骤。
#
# 注意：resolver 只供后台预热/刷新 prefer_domain 使用，应指向不包含
# 本插件的底层解析器/序列，避免递归调用。ip_matcher 可以引用任意实现
# IPMatcherProvider 的 tag，包括 ip_set 和 si_set。
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

plugins:
  - tag: prefer_domain_cf
    type: prefer_domain
    args:

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 一、优选域名解析器
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      # 必填：仅供后台预热与刷新 rules 中的 prefer_domain 使用
      resolver: Direct      # 使用 Direct 解析

      # 单次优选域名查询超时，单位毫秒；必须大于 0 且小于 2500 毫秒
      # 以确保周期窗口内的两次有界尝试可放入固定 5 秒提前量
      timeout: 500


      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 二、优选域名预热与刷新
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      # 所有插件加载完成后，首次后台预解析全部 prefer_domain 的 A 和 AAAA
      warm_on_start: true


      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 三、独立内部缓存与 TTL
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      # 必填，单位秒且必须大于 5；是内部 TTL 和刷新窗口的唯一依据
      # 内部 TTL 不从 DNS 答案推导；固定在到期前 5 秒刷新
      cache_ttl: 300

      # 客户端可见 TTL 沿用优选 DNS 答案并随缓存年龄递减；stale 固定为 0


      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 四、过期缓存兜底
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      # 刷新失败且内部缓存过期时继续使用旧地址，客户端可见 TTL 设为 0
      serve_stale: true

      # 过期优选地址最多继续使用的时间，单位秒；0 表示不限制
      max_stale: 3600


      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 五、IP 命中与优选域名映射
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      # 多条规则按配置顺序匹配，第一条命中的规则生效
      rules:
        - ip_matcher: geoip:cloudflare
          prefer_domain: saas.sin.fan
